version: '3'

services:

  biogenome_mongo_dev_env:
    image: mongo:6.0
    container_name: "${DB_HOST}"
    env_file:
      - .env
    volumes:
     - mongodb-data:/var/lib/mongodb-data
     - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh

    ports:
      - 27015:${DB_PORT}

  biogenome_server:
    build: ./server
    container_name: "biogenome_server"
    restart: always
    volumes:
      - ./server:/server
      # Inject Celery Beat schedule JSON (defaults to repo file; set CELERY_BEAT_SCHEDULE_HOST in .env to override)
      - ${CELERY_BEAT_SCHEDULE_HOST:-./server/celery_beat_schedule.json}:/server/celery_beat_schedule.json:ro
      - /home/emilior/cbp-annotations-data:/annotations_data
      - ./configs:/biogenome-client/src/data/configs
    env_file:
      - .env
    ports:
     - 5000:5000
    depends_on:
      - redis

  # Replaced by celery_beat; schedule: server/celery_beat_schedule.json (volume below).

  biogenome_nginx:
    build:
      context: ./biogenome-client
      dockerfile: Dockerfile
      args:
        ROOT_NODE: ${ROOT_NODE}
    container_name: "biogenome_nginx"
    restart: always
    volumes:
      - ./biogenome-client:/biogenome-client
      - node_modules:/biogenome-client/node_modules
    env_file:
      - .env
    ports:
        - "91:${API_PORT}"


  celery:
    build: ./server
    command: celery --app app.celery_app worker --loglevel=info --autoscale=2,1
    restart: always
    volumes:
      - ./server:/server
      - ${CELERY_BEAT_SCHEDULE_HOST:-./server/celery_beat_schedule.json}:/server/celery_beat_schedule.json:ro
    env_file:
      - .env
    depends_on:
      - biogenome_server
      - biogenome_mongo_dev_env
      - redis

  celery_beat:
    build: ./server
    command: celery --app app.celery_app beat --loglevel=info
    restart: always
    volumes:
      - ./server:/server
      - ${CELERY_BEAT_SCHEDULE_HOST:-./server/celery_beat_schedule.json}:/server/celery_beat_schedule.json:ro
    env_file:
      - .env
    depends_on:
      - biogenome_server
      - biogenome_mongo_dev_env
      - redis

  redis:
    image: "redis:alpine"

volumes:
  app:
  node_modules:
  mongodb-data:
