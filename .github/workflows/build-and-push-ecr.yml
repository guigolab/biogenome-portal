# Build and push backend + Next.js (portal_next) images to ECR.
#
# Triggered by repository_dispatch from a private config repo (type: full-deploy)
# or manually via workflow_dispatch.
#
# The private config repo is checked out first (path: bgp-configs/) and its
# branding/ directory is copied into the Next build context so bake-portal.mjs
# can merge the deployment-specific portal.config.json and assets.
#
# Each portal variant produces a distinct image tag, e.g.:
#   portal_next:cbp      — Catalan Biogenome Project
#   portal_next:biogenoma — default / demo
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   ECR_REGISTRY, ECR_REPOSITORY
#   PAT  — token for checking out the public repo
#
# Per-deployment secrets (optional, add more as needed):
#   CBP_PORTAL_API_BASE, CBP_PORTAL_ROOT_TAXID, CBP_NEXT_PUBLIC_CMS
#   CBP_NEXT_PUBLIC_MATOMO_URL, CBP_NEXT_PUBLIC_MATOMO_SITE_ID
name: Build and Push

on:
  repository_dispatch:
    types: [full-deploy]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private config repo
        uses: actions/checkout@v4
        with:
          path: ./bgp-configs

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: guigolab/biogenome-portal
          token: ${{ secrets.PAT }}
          path: ./biogenome-portal
          # repository_dispatch should pass client_payload.commit; workflow_dispatch defaults to main
          ref: ${{ github.event.client_payload.commit || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:biogenome_back" ./biogenome-portal/server
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:biogenome_back"

      # ── portal_next:biogenoma — generic / demo image (no branding) ──────────
      - name: Build portal_next:biogenoma (default)
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build \
            --build-arg "NEXT_PUBLIC_BASE_PATH=" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next_biogenoma" \
            -f ./biogenome-portal/front/Dockerfile \
            ./biogenome-portal/front
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next_biogenoma"

      # ── portal_next:cbp — Catalan Biogenome Project branded image ───────────
      # Expects bgp-configs/cbp/branding/ with:
      #   portal.config.json  — partial PortalConfig (titles, theme, footer, etc.)
      #   portal-logo.png     — logo for navbar/footer/favicon
      #   hero-map.geojson    — optional map overlay
      - name: Inject CBP branding into build context
        run: |
          if [ -d ./bgp-configs/cbp/branding ]; then
            cp -r ./bgp-configs/cbp/branding ./biogenome-portal/front/branding
            echo "CBP branding injected."
          else
            echo "No CBP branding directory found — skipping (image will use defaults)."
          fi

      - name: Build portal_next:cbp
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          PORTAL_API_BASE: ${{ secrets.CBP_PORTAL_API_BASE }}
          PORTAL_ROOT_TAXID: ${{ secrets.CBP_PORTAL_ROOT_TAXID }}
          NEXT_PUBLIC_CMS: ${{ secrets.CBP_NEXT_PUBLIC_CMS }}
          NEXT_PUBLIC_MATOMO_URL: ${{ secrets.CBP_NEXT_PUBLIC_MATOMO_URL }}
          NEXT_PUBLIC_MATOMO_SITE_ID: ${{ secrets.CBP_NEXT_PUBLIC_MATOMO_SITE_ID }}
        run: |
          docker build \
            --build-arg "NEXT_PUBLIC_BASE_PATH=" \
            --build-arg "PORTAL_API_BASE=${PORTAL_API_BASE}" \
            --build-arg "PORTAL_ROOT_TAXID=${PORTAL_ROOT_TAXID}" \
            --build-arg "NEXT_PUBLIC_CMS=${NEXT_PUBLIC_CMS}" \
            --build-arg "NEXT_PUBLIC_MATOMO_URL=${NEXT_PUBLIC_MATOMO_URL}" \
            --build-arg "NEXT_PUBLIC_MATOMO_SITE_ID=${NEXT_PUBLIC_MATOMO_SITE_ID}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next_cbp" \
            -f ./biogenome-portal/front/Dockerfile \
            ./biogenome-portal/front
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next_cbp"
