# Build and push backend + Next.js (portal_next) images to ECR.
#
# Triggered by repository_dispatch from a private config repo (type: full-deploy)
# or manually via workflow_dispatch.
#
# Branding is NOT baked into these images (front-config-centralization-plan.md Phase 3):
# portal.json and logos are bind-mounted at deploy time. Both Next builds below use an empty
# NEXT_PUBLIC_BASE_PATH (root deploy). Subpath instance images are built by the matrix
# workflow in bgp-configs/.github/workflows/build-next-front-ecr.yml.
#
# Tags produced:
#   biogenome_back              — Flask backend
#   portal_next / portal_next_biogenoma — generic root-basePath Next image
#   portal_next_cbp             — CBP production root-basePath Next image (optional Matomo args)
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   ECR_REGISTRY, ECR_REPOSITORY
#   PAT  — token for checking out the public repo
#
# Optional (CBP Matomo only — still build-arg based; general.matomo in portal.json is not wired yet):
#   CBP_NEXT_PUBLIC_MATOMO_URL, CBP_NEXT_PUBLIC_MATOMO_SITE_ID
name: Build and Push

on:
  repository_dispatch:
    types: [full-deploy]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: guigolab/biogenome-portal
          token: ${{ secrets.PAT }}
          path: ./biogenome-portal
          # repository_dispatch should pass client_payload.commit; workflow_dispatch defaults to main
          ref: ${{ github.event.client_payload.commit || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:biogenome_back" ./biogenome-portal/server
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:biogenome_back"

      # ── portal_next:biogenoma — generic root-basePath image ─────────────────
      - name: Build portal_next:biogenoma (default)
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build \
            --build-arg "NEXT_PUBLIC_BASE_PATH=" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next_biogenoma" \
            -f ./biogenome-portal/front/Dockerfile \
            ./biogenome-portal/front
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next_biogenoma"

      # ── portal_next:cbp — CBP production root-basePath image ────────────────
      # Branding is mounted at deploy time (bgp-configs/biogenome-portal-cbp/). Matomo remains
      # optional build-arg overrides until general.matomo is wired into the Next tracker.
      - name: Build portal_next:cbp
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          NEXT_PUBLIC_MATOMO_URL: ${{ secrets.CBP_NEXT_PUBLIC_MATOMO_URL }}
          NEXT_PUBLIC_MATOMO_SITE_ID: ${{ secrets.CBP_NEXT_PUBLIC_MATOMO_SITE_ID }}
        run: |
          docker build \
            --build-arg "NEXT_PUBLIC_BASE_PATH=" \
            --build-arg "NEXT_PUBLIC_MATOMO_URL=${NEXT_PUBLIC_MATOMO_URL}" \
            --build-arg "NEXT_PUBLIC_MATOMO_SITE_ID=${NEXT_PUBLIC_MATOMO_SITE_ID}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next_cbp" \
            -f ./biogenome-portal/front/Dockerfile \
            ./biogenome-portal/front
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:portal_next_cbp"
