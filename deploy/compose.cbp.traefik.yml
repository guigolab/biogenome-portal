# CBP production stack: Traefik routes /api → Flask and everything else → Next.
# Prerequisites: external Docker network `biogenome` (same as your Traefik stack).
#
# portal.json, logo, and other branding assets are now BAKED into the Next image
# at build time via scripts/bake-portal.mjs — no bind-mounts needed for them.
#
# Required in .env (or environment) when deploying:
#   PORTAL_NEXT_IMAGE  — ECR image tag, e.g. .../biogenome_registry:portal_next_cbp
#
# Optional runtime server-side knobs (not branding; affect internal fetch routing):
#   INTERNAL_FETCH_ORIGIN  — internal URL of the Flask API (e.g. http://cbp_server:5000)
#                            Set only when Next and Flask are on different internal hosts.
#                            Omit when Traefik routes /api on the same public host.

services:
  cbp_mongo:
    image: mongo:6.0
    container_name: "${DB_HOST}"
    restart: always
    env_file:
      - .env
    volumes:
      - /data/cbp-data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh
    ports:
      - "27016:${DB_PORT}"
    networks:
      - biogenome

  cbp_server:
    image: 566365074765.dkr.ecr.eu-central-1.amazonaws.com/biogenome_registry:biogenome_back
    restart: always
    depends_on:
      - cbp_redis
    volumes:
      - ${ANNOTATIONS_PATH}:/server/annotations_data
      # Defaults to deploy/celery_beat_schedule.json when run from this folder.
      - ${CELERY_BEAT_SCHEDULE_HOST:-./celery_beat_schedule.json}:/server/celery_beat_schedule.json:ro
      - ./templates:/server/templates
      - cbp_shared_tmp:/app/tmp
    environment:
      - REDIS_HOST=cbp_redis
    env_file:
      - .env
    networks:
      - biogenome
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=biogenome"
      # API — higher priority than cbp_ui
      - "traefik.http.routers.cbp_api.rule=(Host(`dades.biogenoma.cat`) || Host(`data.biogenoma.cat`) || Host(`dades.biogenoma.org`) || Host(`data.biogenoma.org`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.cbp_api.priority=100"
      - "traefik.http.routers.cbp_api.entrypoints=web_https"
      - "traefik.http.routers.cbp_api.tls=true"
      - "traefik.http.routers.cbp_api.tls.certResolver=letsencrypt"
      - "traefik.http.routers.cbp_api.tls.domains[0].main=dades.biogenoma.cat"
      - "traefik.http.routers.cbp_api.tls.domains[0].sans=data.biogenoma.cat,dades.biogenoma.org,data.biogenoma.org"
      - "traefik.http.routers.cbp_api.service=cbp_api"
      - "traefik.http.routers.cbp_api.middlewares=cbp_api_compress"
      - "traefik.http.services.cbp_api.loadbalancer.server.port=5000"
      - "traefik.http.middlewares.cbp_api_compress.compress=true"

  cbp_next:
    # NEXT_PUBLIC_SHOW_COUNTRIES is baked into the image at build time (Next.js inlines it into the
    # client bundle). Runtime environment cannot change it — rebuild the image with the desired
    # --build-arg NEXT_PUBLIC_SHOW_COUNTRIES=true|false to toggle country UI.
    image: ${PORTAL_NEXT_IMAGE:?set PORTAL_NEXT_IMAGE to your ECR Next image, e.g. .../biogenome_registry:portal_next_cbp}
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # Set only when Flask is reachable on a different internal host than the public URL.
      # Example: - INTERNAL_FETCH_ORIGIN=http://cbp_server:5000
      # When Traefik proxies /api on the same public host, this can be omitted.
    networks:
      - biogenome
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=biogenome"
      - "traefik.http.routers.cbp_ui.rule=Host(`dades.biogenoma.cat`) || Host(`data.biogenoma.cat`) || Host(`dades.biogenoma.org`) || Host(`data.biogenoma.org`)"
      - "traefik.http.routers.cbp_ui.priority=10"
      - "traefik.http.routers.cbp_ui.entrypoints=web_https"
      - "traefik.http.routers.cbp_ui.tls=true"
      - "traefik.http.routers.cbp_ui.tls.certResolver=letsencrypt"
      - "traefik.http.routers.cbp_ui.tls.domains[0].main=dades.biogenoma.cat"
      - "traefik.http.routers.cbp_ui.tls.domains[0].sans=data.biogenoma.cat,dades.biogenoma.org,data.biogenoma.org"
      - "traefik.http.routers.cbp_ui.service=cbp_ui"
      - "traefik.http.services.cbp_ui.loadbalancer.server.port=3000"

  cbp_celery:
    image: 566365074765.dkr.ecr.eu-central-1.amazonaws.com/biogenome_registry:biogenome_back
    command: celery --app app.celery_app worker --loglevel=info --autoscale=1,1
    restart: always
    volumes:
      - ${CELERY_BEAT_SCHEDULE_HOST:-./celery_beat_schedule.json}:/server/celery_beat_schedule.json:ro
      - cbp_shared_tmp:/app/tmp
    env_file:
      - .env
    depends_on:
      - cbp_server
      - cbp_mongo
      - cbp_redis
    networks:
      - biogenome

  cbp_celery_beat:
    image: 566365074765.dkr.ecr.eu-central-1.amazonaws.com/biogenome_registry:biogenome_back
    command: celery --app app.celery_app beat --loglevel=info
    restart: always
    volumes:
      - ${CELERY_BEAT_SCHEDULE_HOST:-./celery_beat_schedule.json}:/server/celery_beat_schedule.json:ro
      - cbp_shared_tmp:/app/tmp
    env_file:
      - .env
    depends_on:
      - cbp_server
      - cbp_celery
      - cbp_mongo
      - cbp_redis
    networks:
      - biogenome

  cbp_redis:
    image: redis:alpine
    restart: always
    expose:
      - "6379"
    volumes:
      - cbp_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - biogenome

volumes:
  cbp_shared_tmp:
  cbp_redis_data:

networks:
  biogenome:
    external: true
    name: biogenome
